services:
  postgres:
    image: postgres:17-alpine
    container_name: invoicesweb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoices
      POSTGRES_PASSWORD: invoices
      POSTGRES_DB: invoices_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoices -d invoices_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
